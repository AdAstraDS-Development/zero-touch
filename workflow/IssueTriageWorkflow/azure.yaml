# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: issue-triage
services:
    ai-project:
        host: azure.ai.project
    issue-triage:
        # bundled: azd runs `dotnet publish` locally (resolving the references to /agents and /tools) and
        # uploads the publish output, instead of Foundry building the agent folder remotely.
        project: .
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            dependencyResolution: bundled
            entryPoint: IssueTriageWorkflow.dll
            runtime: dotnet_10
        env:
            ASPNETCORE_URLS: http://+:8088
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            GITHUB_APP_ID: ${GITHUB_APP_ID}
            GITHUB_API_URL: ${GITHUB_API_URL}
            AZURE_KEY_VAULT_URI: ${AZURE_KEY_VAULT_URI}
            GITHUB_APP_PRIVATE_KEY_SECRET_NAME: ${GITHUB_APP_PRIVATE_KEY_SECRET_NAME}
            GITHUB_ALLOWED_REPOS: ${GITHUB_ALLOWED_REPOS}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Reads a GitHub issue and the relevant source code of its repository, checks whether the issue is clear enough to work on, estimates a T-shirt size (XS/S/L/XL), posts the result as a comment and sets the triage/ready and size/* labels on the issue.
        kind: hosted
        name: issue-triage
        protocols:
            - protocol: responses
              version: 2.0.0
