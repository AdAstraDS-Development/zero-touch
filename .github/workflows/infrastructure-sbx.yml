name: Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
      - '.github/workflows/infrastructure-sbx.yml'

permissions:
  id-token: write
  contents: read

env:
  TERRAFORM_VERSION: 1.14.6
  ARM_RESOURCE_GROUP: msservicesart-sbx-state
  ARM_STORAGE_ACCOUNT: msservicesartsbx
  ARM_CONTAINER_NAME: terraform-state
  ARM_KEY: terraform-zero-touch.tfstate

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: sandbox
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Test Azure CLI Connection
        run: |
          az --version
          az account set --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }}
          az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.ARM_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.ARM_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.ARM_CONTAINER_NAME }}" \
            -backend-config="key=${{ env.ARM_KEY }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform Plan
        id: tf-plan
        working-directory: ./infrastructure
        run: |
          terraform plan \
            -var-file=environments/sbx.tfvars \
            -out=tf.plan \
            -input=false \
            -detailed-exitcode
        continue-on-error: true

      - name: Check Plan Status
        run: |
          if [ ${{ steps.tf-plan.outcome }} == 'failure' ]; then
            echo "Terraform plan failed"
            exit 1
          fi
          echo "Plan exit code: ${{ steps.tf-plan.outputs.exitcode }}"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: infrastructure/tf.plan
          retention-days: 5

  apply:
    name: Terraform Apply
    needs: plan
    if: needs.plan.outputs.tfplanExitCode == '2'
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ARM_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan
          path: infrastructure/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./infrastructure
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.ARM_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.ARM_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.ARM_CONTAINER_NAME }}" \
            -backend-config="key=${{ env.ARM_KEY }}" \
            -backend-config="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform Apply
        working-directory: ./infrastructure
        run: terraform apply -input=false tf.plan
        